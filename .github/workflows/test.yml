name: Tests

# Family CI contract (mirrored in the Unity and Unreal siblings): every leg exposes EXACTLY four
# check contexts, named exactly `gates`, `tests`, `extensions`, `docs`. Those four words are the
# required-status-check contexts in the canonical ruleset pair (.github/rulesets/protect-dev.json),
# and a job's *display name* is its check context — so each job's `name:` below is load-bearing.
# Renaming one silently orphans the branch protection.
#
# Here "tests" = the headless GDScript suites (Godot has no compile step), driven exactly
# like the local loop: build the class cache once, then run each tests/*.gd script (each
# quits with a non-zero code on failure, so the step fails).

on:
  push:
    branches: [master, dev]
  # No `paths:` filter on ANY of the four jobs: they are *required* status checks, so they must
  # always report a conclusion — a filtered required check never reports on a PR outside its
  # paths (e.g. docs-only or issue-template changes) and blocks that PR forever.
  pull_request:
    branches: [master, dev]

# One run per ref; superseded PR pushes are cancelled, push builds on master/dev never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI targets the version the project is verified on (matches local dev). The supported floor is
  # 4.4 (MIN_GODOT in both plugins: the compiler core uses 4.3+ APIs like
  # ProjectSettings.get_global_class_list, and the editor addon's bundled analyzer GDExtension has
  # compatibility_minimum = "4.4"; FoldableContainer is is_class()/string-guarded so it degrades
  # gracefully below 4.5), but we test on the current stable.
  GODOT_VERSION: "4.7.0"
  NODE_VERSION: "22"

jobs:
  # Engine-free gates run without Godot so they stay green even when engine CI is unavailable.
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: family-corpus hash gate (A4/TD-009 mirror tripwire)
        # Verifies the mirrored family scanner corpus (familyCore tiers) still hashes to the
        # value pinned in plans/family-corpus.hash — i.e. it has not drifted from the Unreal/Unity
        # siblings. Re-pin with `node scripts/corpus-hash.mjs --write` after an intentional change.
        run: node scripts/corpus-hash.mjs --check

      - name: machine-local path gate (no tracked path may exist on only one machine)
        # Family invariant, mirrored in the Unreal/Unity siblings. The 0.13.0 rename wave rewrote a
        # repo-folder segment INSIDE a hardcoded absolute path in .vscode/launch.json and silently
        # broke F5 for every clone whose folder name differs; three audits read that line and moved
        # on. Repo locations must be derived (VS Code's workspace-folder variable, the script's
        # `..`, `git worktree list`) and tools probed ($GODOT_BIN → .ruitk-local.json → PATH). Read a
        # failure with `node scripts/check-machine-paths.mjs --list`; see CLAUDE.md
        # "Machine-local paths".
        run: node scripts/check-machine-paths.mjs

      - name: Changelog sync gate (changelog.json in sync with generated CHANGELOG.md files)
        # Guards the exact failure mode that shipped GUITKX 0.6.0-0.8.4: the generated CHANGELOG.md
        # files (vscode, vs2022, and the Godot editor addon since its 0.6.3 cutover) must be
        # regenerated from ide-extensions/changelog.json and committed together with it — nothing
        # stops someone from hand-editing a CHANGELOG.md (or adding a changelog.json entry without
        # regenerating) in between publishes, and nothing did, which is exactly how changelog.json
        # silently fell 14 versions behind. This step fails loudly, with a diff, on every push/PR.
        run: node ide-extensions/scripts/changelog.mjs verify

      - name: discord changelog (format + caps)
        # Family gate, mirrored in the Unity/Unreal siblings: every plans/DISCORD_CHANGELOG.md
        # entry must fit Discord's 2000-char message cap, carry no masked [text](url) links (they
        # do not render in plain Discord messages), and keep its `## [<version>]` header unique —
        # that header is also publish.yml's discord-job dedup key against the channel history.
        run: node scripts/discord-changelog.mjs verify

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }} (headless)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      # The class-cache scan must run BEFORE the compile step on a fresh clone: guitkx_build's
      # two-pass parse gate reload()s every generated .gd, whose code references global
      # class_names (V, Hooks, RuitkVNode, hand-written DoomTypes, ...) that only resolve once
      # .godot/global_script_class_cache.cfg exists. This mirrors the real editor lifecycle —
      # the editor always scans before its watcher compiles. (PR #71 CI capture: 49/49
      # "Identifier V not declared" parse fails without it.)
      - name: Build class cache (committed class_names -- required by the parse gate)
        run: godot --headless --path . --editor --quit || true

      - name: Compile .guitkx -> sibling .gd (generated output is git-ignored)
        run: godot --headless --path . --script res://tests/guitkx_build.gd

      - name: Contract goldens are fresh (GD half of the GD<->TS grammar parity harness)
        run: godot --headless --path . --script res://tests/contract_dump.gd -- --check

      # Second scan AFTER the build: registers the just-generated .gd class_names so the demo /
      # doom / editor suites resolve them by global name.
      - name: Rebuild class cache (now includes the generated .gd)
        run: godot --headless --path . --editor --quit || true

      - name: Core reconciler / hooks tests
        run: godot --headless --path . --script res://tests/core_test.gd

      - name: Project Settings bridge tests (reactive_ui_toolkit/* -> RuitkConfig/RuitkDiagnostics)
        run: godot --headless --path . --script res://tests/settings_test.gd

      - name: Render scheduler tests (four-lane RuitkScheduler + sliced-render integration)
        run: godot --headless --path . --script res://tests/scheduler_test.gd

      - name: Style + elements tests
        run: godot --headless --path . --script res://tests/style_test.gd

      - name: Router foundation tests (path / match / ranker)
        run: godot --headless --path . --script res://tests/router_match_test.gd

      - name: Router spine tests (routes / outlet / nav / blockers)
        run: godot --headless --path . --script res://tests/router_spine_test.gd

      - name: Reconciler update / diff tests
        run: godot --headless --path . --script res://tests/update_test.gd

      - name: Demo smoke tests
        run: godot --headless --path . --script res://tests/demos_test.gd

      - name: Error-boundary latch + strict-mode tests (RuitkFail, _handle_render_failure)
        run: godot --headless --path . --script res://tests/strict_boundary_test.gd

      - name: GUITKX compiler tests (.guitkx -> .gd + codegen mechanism)
        run: godot --headless --path . --script res://tests/guitkx_test.gd

      - name: Fast Refresh tests (runtime HMR — in-place reload + targeted re-render)
        run: godot --headless --path . --script res://tests/hmr_test.gd

      - name: Editor markup-intelligence tests (lsp/ modules — context/schema/workspace/completion/hover)
        run: godot --headless --path . --script res://tests/guitkx_lsp_test.gd

      - name: Editor addon tests (substrate, data safety, goto-def, find bar, deps handshake, schema sync)
        run: godot --headless --path . --script res://tests/guitkx_editor_test.gd

      # Codemod tripwires (M8.6): both runners must be no-ops on the committed tree — a non-zero
      # count means pre-0.10 syntax (migrate) or wrapper keywords (modernize) were committed; the
      # runner exits 1 after fixing the files locally, so the fix is "commit what it rewrote".
      - name: 0.10.0 import-migration tripwire (tree must already be migrated)
        run: godot --headless --path . --script res://tests/guitkx_migrate.gd

      - name: 0.11.0 ES-modules modernization tripwire (tree must already be plain-syntax)
        run: godot --headless --path . --script res://tests/guitkx_modernize.gd

      - name: 0.13.0 rename-migration tripwire (tree must already be renamed)
        run: godot --headless --path . --script res://tests/guitkx_rename_migrate.gd

  # The .guitkx IDE tooling: the TypeScript language server (unit tests + an end-to-end stdio LSP
  # smoke test) and the VS Code extension (type-check + server bundle + .vsix package). The VS2022
  # extension needs the VS SDK and is built on Windows with the VS toolchain, so it is not built here.
  extensions:
    name: extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build language server
        working-directory: ide-extensions/lsp-server
        run: npm ci && npm run build

      - name: Language server unit tests (scanner / source map / virtual doc / context routing)
        working-directory: ide-extensions/lsp-server
        run: node --test out/test/*.test.js

      - name: End-to-end LSP smoke test (stdio handshake + markup completion)
        working-directory: ide-extensions/lsp-server
        run: node scripts/smoke.js

      - name: Build VS Code extension
        working-directory: ide-extensions/vscode
        run: npm ci && npm run build

      - name: Bundle server + package .vsix
        working-directory: ide-extensions/vscode
        run: |
          node scripts/bundle-server.js
          npx --yes @vscode/vsce package --no-dependencies --out guitkx.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: guitkx-vsix
          path: ide-extensions/vscode/guitkx.vsix

  # The docs site (RuitkGodotDocs~ — trailing ~ so the Godot importer skips it): type-check +
  # production Vite build. No deploy here; this proves the site still builds on every push/PR.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build docs site (tsc -b + vite build)
        working-directory: "RuitkGodotDocs~"
        run: npm ci && npm run build
